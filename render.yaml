services:
  - type: web
    name: ascend-ai-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: GROQ_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://ascend-ai-sandy.vercel.app
      - key: CORS_ORIGIN_REGEX
        value: ^https://ascend-ai(?:-[a-z0-9-]+)?\.vercel\.app$
      - key: TRUSTED_PROXY_HOPS
        value: "1"
